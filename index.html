<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام الحضور والإجازات</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>H</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>
    // رقم الإصدار — بيزيد مع كل تحديث (ولازم يطابق version.json)
    window.APP_VERSION = "24";
    try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
    document.write('<link rel="stylesheet" href="css/style.css?v=' + window.APP_VERSION + '">');
  </script>
</head>
<body>

  <!-- ===================== شاشة الدخول ===================== -->
  <section id="login-view" class="login-wrap" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="login-logo">📊</div>
      <h1>نظام الحضور والإجازات</h1>
      <p class="muted">سجّل الدخول للمتابعة</p>
      <label>اسم المستخدم
        <input id="login-user" name="username" autocomplete="username" required placeholder="مثال: a.salam">
      </label>
      <label>كلمة المرور
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div id="login-error" class="form-error" hidden></div>
      <button class="btn btn-primary btn-block" type="submit" id="login-btn">دخول</button>
      <div class="login-sig" data-signature></div>
    </form>
  </section>

  <!-- ===================== التطبيق ===================== -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">📊</span>
        <div>
          <div class="brand-title">نظام الحضور والإجازات</div>
          <div class="brand-sub" id="conn-status">جاري الاتصال...</div>
          <div class="app-version" id="app-version"></div>
        </div>
      </div>
      <nav class="mainnav" id="mainnav">
        <a href="#attendance" data-page="attendance">📈 تقرير البصمة</a>
        <a href="#leaves" data-page="leaves">🏖️ الإجازات</a>
        <a href="#absences" data-page="absences">⏰ الغياب والتأخير</a>
        <a href="#reports" data-page="reports">📑 التقارير</a>
        <a href="#movement" data-page="movement" id="nav-movement" hidden>🚶 الدخول والخروج</a>
        <a href="#settings" data-page="settings" id="nav-settings" hidden>⚙️ الإعدادات</a>
      </nav>
      <div class="userbox">
        <span class="user-chip" id="user-name">—</span>
        <button class="btn btn-ghost btn-sm theme-btn" id="theme-btn" type="button">🌙</button>
        <button class="btn btn-ghost btn-sm" id="refresh-btn" title="تحديث البيانات">🔄</button>
        <button class="btn btn-ghost btn-sm" id="logout-btn">خروج</button>
      </div>
    </header>

    <main id="page" class="page"></main>
    <footer class="app-footer"><div data-signature></div></footer>
  </div>

  <!-- نافذة منبثقة عامة -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modal-title"></h3>
        <button class="btn btn-ghost btn-sm" data-close>✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
  <div id="loading" class="loading" hidden><div class="spinner"></div><span id="loading-text">جاري التحميل...</span></div>

  <script src="lib/supabase.js"></script>
  <script src="lib/xlsx.full.min.js"></script>
  <script>document.write('<script src="js/config.js?v=' + window.APP_VERSION + '"><\/script>');</script>
  <script>document.write('<script src="js/signature.js?v=' + window.APP_VERSION + '"><\/script>');</script>
  <script>document.write('<script src="js/rules.js?v=' + window.APP_VERSION + '"><\/script>');</script>
  <script>document.write('<script src="js/app.js?v=' + window.APP_VERSION + '"><\/script>');</script>
  <script>document.write('<script src="js/attendance.js?v=' + window.APP_VERSION + '"><\/script>');</script>
  <script>document.write('<script src="js/reports.js?v=' + window.APP_VERSION + '"><\/script>');</script>
  <script>document.write('<script src="js/movement.js?v=' + window.APP_VERSION + '"><\/script>');</script>
  <script>document.write('<script src="js/settings.js?v=' + window.APP_VERSION + '"><\/script>');</script>
</body>
</html>
